# crop_params_global.yaml urun keyi -> GAEZ v4 3-harfli urun kodu
#
# Kaynak: FAO GAEZ v4 crop list (51 urun, 8110H high-input baseline).
# Bizim ekilebilir 115 urunumuzun 43'u GAEZ'de bire bir eslesiyor. Geriye kalan
# 72 urun (meyve agaclari, sebzeler, baharatlar, cerezlikler) GAEZ'de bu isimle
# yok; onlar icin skor sadece EcoCrop katkisi ile hesaplanir (verimlilik puani
# 0.3 skala, GAEZ katkisi 0 olur).
#
# guven degerleri:
#   yuksek: bilimsel_ad tam eslesiyor (ornek: bugday=Triticum aestivum=whe)
#   orta:   grup eslesmesi (ornek: portakal/limon/mandalina hepsi = cit)
#
# GAEZ kod acilimlari (referans):
#   whe wheat, mze maize, rcw rice wetland, brl barley, oat oat, rye rye,
#   srg sorghum, pml pearl millet, bck buckwheat, soy soybean, phb phaseolus
#   bean, chk chickpea, pea dry pea, cow cowpea, grm green gram, pig pigeonpea,
#   grd groundnut, alf alfalfa, wpo white potato, spo sweet potato, csv cassava,
#   yam yam, sub sugar beet, car carrot, tom tomato, oni onion, cab cabbage,
#   olv olive, cit citrus, ban banana, sfl sunflower, rsd rapeseed, flx flax,
#   olp oil palm, con coconut, suc sugar cane, cot cotton, tob tobacco,
#   cof coffee, tea tea, coc cocoa

bugday:            {gaez: whe, guven: yuksek}
