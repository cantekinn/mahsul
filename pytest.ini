[pytest]
testpaths = tests

# paylasim/ takim arkadaslarinin ham dosyalari; icinde calistirilabilir betikler
# var ve toplama sirasinda import edilmeleri gerekmiyor.
norecursedirs = paylasim _yayin data web node_modules .git

# NOT: bu makinede pytest-qt kurulu ama PyQt kurulu degil; pytest o eklentiyi
# yuklerken hata verip test toplamaya bile baslayamiyor. Eklenti bu projeyle
# ilgisiz oldugu icin cozum otomatik eklenti yuklemesini kapatmak:
#     PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 py -m pytest
# Temiz bir ortamda (requirements.txt kurulmus) duz `py -m pytest` yeter.
