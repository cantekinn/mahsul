<!-- Tarim Asistani markasi: filiz.
     Zemin #2f7a3e, stil.css'teki yesil tokeni ile AYNI deger: ikon ile arayuz
     tek paletten beslensin diye ikinci bir yesil uydurulmadi.
     16 pikselde okunmasi gerektigi icin AYRINTI YOK: bir sap, iki yaprak.
     icon-192.png / icon-512.png / icon-maskable-512.png bu dosyadan
     turetildi, elle cizilmedi.
     DIKKAT: bu bir XML yorumu, icinde iki kisa cizgi yan yana YAZILAMAZ;
     yazilirsa dosya gecersiz XML olur ve tarayici ikonu hic cizmez. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#2f7a3e" />
  <path d="M32 53 V32" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Iki yaprak iki tonda: duz beyaz siluet olsa yapraklar birbirine yapisirdi. -->
  <path d="M31 37 C 31 24 22 15 11 14 C 10 27 18 36 31 37 Z" fill="#ffffff" />
  <path d="M33 44 C 33 33 41 25 53 24 C 54 36 45 44 33 44 Z" fill="#a8d5a2" />
</svg>
